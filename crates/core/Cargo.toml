[package]
name = "jwl-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "JiraWorklog domain logic, storage and Jira client. Free of Tauri."

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
specta.workspace = true
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
chrono-tz = "0.10"
tempfile = "3"
