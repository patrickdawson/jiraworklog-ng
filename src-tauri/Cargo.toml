[package]
name = "jiraworklog"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "JiraWorklog desktop shell"

[lib]
name = "jiraworklog_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jwl-core = { path = "../crates/core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = "0.41"
serde.workspace = true
specta.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_LibraryLoader"] }
