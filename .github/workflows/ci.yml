name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything runs on Windows: the app is Windows-only, and clippy and the
# tests need the Windows APIs (windows-sys, windows-registry, WebView2).
# The Rust toolchain comes from rust-toolchain.toml; rustup installs it on
# the first cargo call.

jobs:
  quality:
    name: Clippy, Rust tests, lint and type check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            e2e/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm ci --prefix e2e
      - run: npm run tauri:check

  e2e:
    name: E2E tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            e2e/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          # The suite builds into target/e2e (debug + e2e feature) and
          # installs tauri-driver into target/tools.
          workspaces: ". -> target/e2e"
          cache-directories: target/tools
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm ci --prefix e2e
      # Builds the E2E exe, fetches tauri-driver and the msedgedriver that
      # matches the runner's WebView2, then runs every spec.
      - run: npm run tauri:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-run
          # App log, tauri-driver log and the test database.
          path: target/e2e/run/
          retention-days: 7

  # A release is due when the version in package.json has no matching v<version> tag yet.
  detect-release:
    name: Detect release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new. A release will be built."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish release
    needs: [quality, e2e, detect-release]
    if: needs.detect-release.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ui
      # Release profile (LTO, opt-level "s", panic = "abort") plus the NSIS
      # installer in target/release/bundle/nsis/. No cache: a release builds
      # from scratch.
      - run: npm run tauri:build
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry for $VERSION." > release-notes.md
          fi
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "target/release/bundle/nsis/JiraWorklog_${VERSION}_x64-setup.exe" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md
